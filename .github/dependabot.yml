version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Bahrain
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: "/Windows/HerdMe.Windows"
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Bahrain
    open-pull-requests-limit: 5
    groups:
      windows-runtime:
        patterns:
          - "*"
