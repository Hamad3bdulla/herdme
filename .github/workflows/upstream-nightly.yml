name: Upstream release sources

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-release-sources
  cancel-in-progress: true

jobs:
  live-contracts:
    name: Verify runtime and service releases
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET 8
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x

      - name: Verify live release metadata, checksums, and downloads
        shell: pwsh
        run: |
          dotnet run `
            --project Windows/HerdMe.Windows.ContractTests/HerdMe.Windows.ContractTests.csproj `
            --configuration Release `
            -p:TreatWarningsAsErrors=true `
            -- `
            --live-service-releases `
            --live-runtime-releases
