name: Windows x64

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Build, test, package, and run (${{ matrix.ui-language }})
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ui-language: [en-US, ar-BH]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Show toolchain
        shell: pwsh
        run: |
          dotnet --info
          cmake --version

      - name: Set the acceptance profile language
        shell: powershell
        env:
          UI_TEST_LANGUAGE: ${{ matrix.ui-language }}
        run: |
          $languages = New-WinUserLanguageList -Language $env:UI_TEST_LANGUAGE
          Set-WinUserLanguageList -LanguageList $languages -Force
          Set-WinUILanguageOverride -Language $env:UI_TEST_LANGUAGE
          Set-Culture -CultureInfo $env:UI_TEST_LANGUAGE

      - name: Verify C# formatting
        shell: pwsh
        run: ./Windows/check-format.ps1

      - name: Test Windows signing configuration contract
        shell: pwsh
        run: ./Windows/test-signing-contract.ps1

      - name: Build and test Debug Windows x64
        shell: pwsh
        run: ./Windows/build.ps1 -Architecture x64 -Configuration Debug

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --no-progress --yes

      - name: Run automated Windows x64 acceptance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $transcript = Join-Path $env:GITHUB_WORKSPACE "build\windows-acceptance.log"
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $transcript) | Out-Null
          $fixture = Join-Path $env:USERPROFILE "HerdMe\readiness-site\public"
          New-Item -ItemType Directory -Force -Path $fixture | Out-Null
          Set-Content -LiteralPath (Join-Path $fixture "index.html") -Value '<!doctype html><title>Readiness site</title><h1>Readiness site</h1>'
          Start-Transcript -Path $transcript -Force -UseMinimalHeader | Out-Null
          try {
              $baseline = Join-Path $env:GITHUB_WORKSPACE 'build\upgrade-baseline'
              gh release download v0.1.18 --repo $env:GITHUB_REPOSITORY --pattern '*win-x64-setup.exe*' --dir $baseline
              if ($LASTEXITCODE -ne 0) { throw 'Could not download the previous installer for upgrade acceptance.' }
              & ./Windows/acceptance.ps1 -Configuration Release -SkipLiveReleaseChecks -CaptureScreenshots -PreviousInstallerPath (Join-Path $baseline 'HerdMe-0.1.18-win-x64-setup.exe')
          }
          catch {
              $message = $_.Exception.Message
              $escaped = $message.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
              Write-Host "::error title=Windows x64 acceptance failed::$escaped"
              throw
          }
          finally {
              Stop-Transcript | Out-Null
          }

      - name: Run Windows accessibility checks
        shell: pwsh
        run: ./Windows/test-accessibility.ps1

      - name: Upload Windows UI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: HerdMe-${{ github.run_number }}-win-x64-${{ matrix.ui-language }}-UI
          path: |
            build/windows-ui-evidence
            build/windows-accessibility
          if-no-files-found: warn
          retention-days: 14

      - name: Collect Windows failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          $source = Join-Path $env:LOCALAPPDATA "HerdMe\Log"
          $destination = Join-Path $env:GITHUB_WORKSPACE "build\windows-diagnostics"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          if (Test-Path -LiteralPath $source -PathType Container) {
              foreach ($name in @(
                  "startup.log",
                  "environment.log",
                  "unhandled.log",
                  "diagnostics.jsonl"
              )) {
                  $candidate = Join-Path $source $name
                  if (Test-Path -LiteralPath $candidate -PathType Leaf) {
                      Copy-Item -LiteralPath $candidate -Destination $destination -Force
                  }
              }
          }

      - name: Upload Windows failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: HerdMe-${{ github.run_number }}-win-x64-${{ matrix.ui-language }}-failure-diagnostics
          path: |
            build/windows-acceptance.log
            build/windows-diagnostics
            build/windows-native-build.log
            build/windows-native-build.binlog
            Windows/HerdMe.Windows/obj/**/input.json
            Windows/HerdMe.Windows/obj/**/output.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows artifacts
        if: matrix.ui-language == 'en-US'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: HerdMe-${{ github.run_number }}-win-x64
          path: |
            dist/HerdMe-*-win-x64-portable.zip
            dist/HerdMe-*-win-x64-portable.zip.sha256
            dist/HerdMe-*-win-x64-setup.exe
            dist/HerdMe-*-win-x64-setup.exe.sha256
          if-no-files-found: error
          retention-days: 14

  arm64-build:
    name: Build Windows ARM64 preview
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      # The x64 job runs every test and the acceptance suite. ARM64 binaries cannot run on this
      # x64 runner, so this job proves the app and core compile for ARM64.
      - name: Cross-compile Release Windows ARM64
        shell: pwsh
        run: ./Windows/build.ps1 -Architecture ARM64 -Configuration Release -SkipTests

      - name: Verify ARM64 executables
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Get-PeMachine([string]$Path) {
              $bytes = [System.IO.File]::ReadAllBytes($Path)
              $offset = [BitConverter]::ToInt32($bytes, 0x3c)
              return [BitConverter]::ToUInt16($bytes, $offset + 4)
          }
          $app = Get-ChildItem Windows/HerdMe.Windows/bin -Recurse -Filter HerdMe.Windows.exe |
              Where-Object { $_.FullName -like "*\ARM64\Release\*" -and $_.FullName -like "*\win-arm64\*" } |
              Select-Object -First 1
          if ($null -eq $app) { throw "The ARM64 app was not produced." }
          foreach ($path in @($app.FullName, (Join-Path $app.DirectoryName "Runtime\herdme-core.exe"))) {
              $machine = Get-PeMachine $path
              if ($machine -ne 0xAA64) { throw "$path is not ARM64 (machine 0x$($machine.ToString('X4')))." }
              Write-Host "ARM64: $path"
          }
          $destination = Join-Path $env:GITHUB_WORKSPACE "build\windows-arm64-preview"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item -Path (Join-Path $app.DirectoryName "*") -Destination $destination -Recurse -Force

      - name: Upload ARM64 preview build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: HerdMe-${{ github.run_number }}-win-arm64-unsigned-preview
          path: build/windows-arm64-preview
          if-no-files-found: error
          retention-days: 7
