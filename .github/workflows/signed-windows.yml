name: Signed Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-windows-x64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-windows:
    name: Sign, test, and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --no-progress --yes

      - name: Test Windows signing configuration contract
        shell: pwsh
        run: ./Windows/test-signing-contract.ps1

      - name: Validate default branch identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $repository = gh api "repos/$env:GITHUB_REPOSITORY" | ConvertFrom-Json
          $defaultBranch = $repository.default_branch
          if ($env:GITHUB_REF -ne "refs/heads/$defaultBranch") {
              throw "Signed Windows builds must run from the default branch."
          }
          $branch = gh api "repos/$env:GITHUB_REPOSITORY/branches/$defaultBranch" |
              ConvertFrom-Json
          if ($branch.commit.sha -ne $env:GITHUB_SHA) {
              throw "The workflow commit is not the current default-branch head."
          }
          ./scripts/check-version.ps1

      - name: Import Windows release certificate
        shell: pwsh
        env:
          CERTIFICATE_PFX_BASE64: ${{ secrets.HERDME_WINDOWS_CERTIFICATE_PFX_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.HERDME_WINDOWS_CERTIFICATE_PASSWORD }}
          TIMESTAMP_URL: ${{ secrets.HERDME_WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_PFX_BASE64)) {
              throw "HERDME_WINDOWS_CERTIFICATE_PFX_BASE64 is not configured."
          }
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD)) {
              throw "HERDME_WINDOWS_CERTIFICATE_PASSWORD is not configured."
          }
          if ([string]::IsNullOrWhiteSpace($env:TIMESTAMP_URL)) {
              throw "HERDME_WINDOWS_TIMESTAMP_URL is not configured."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "herdme-release.pfx"
          try {
              [IO.File]::WriteAllBytes(
                  $certificatePath,
                  [Convert]::FromBase64String($env:CERTIFICATE_PFX_BASE64)
              )
              $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
              $importedCertificates = @(Import-PfxCertificate `
                  -FilePath $certificatePath `
                  -CertStoreLocation Cert:\CurrentUser\My `
                  -Password $password)
          }
          finally {
              Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }
          $now = [DateTime]::UtcNow
          $codeSigningOid = "1.3.6.1.5.5.7.3.3"
          $signingCertificates = @($importedCertificates | Where-Object {
              $_.HasPrivateKey `
                  -and $_.NotBefore.ToUniversalTime() -le $now `
                  -and $_.NotAfter.ToUniversalTime() -gt $now `
                  -and $_.EnhancedKeyUsageList.ObjectId.Value -contains $codeSigningOid
          })
          if ($signingCertificates.Count -ne 1) {
              throw "The PFX must contain exactly one current code-signing certificate with a private key."
          }
          $certificate = $signingCertificates[0]
          "HERDME_WINDOWS_SIGNING_THUMBPRINT=$($certificate.Thumbprint)" | Out-File `
              -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HERDME_WINDOWS_TIMESTAMP_URL=$env:TIMESTAMP_URL" | Out-File `
              -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and test signed Windows x64 artifacts
        shell: pwsh
        env:
          HERDME_RELEASE_MODE: public
        run: ./Windows/acceptance.ps1 -Configuration Release

      - name: Upload signed Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-windows-x64
          path: |
            dist/HerdMe-*-win-x64-portable.zip
            dist/HerdMe-*-win-x64-portable.zip.sha256
            dist/HerdMe-*-win-x64-setup.exe
            dist/HerdMe-*-win-x64-setup.exe.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Remove Windows release certificate
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:HERDME_WINDOWS_SIGNING_THUMBPRINT)) {
              Remove-Item `
                  -LiteralPath "Cert:\CurrentUser\My\$env:HERDME_WINDOWS_SIGNING_THUMBPRINT" `
                  -Force `
                  -ErrorAction SilentlyContinue
          }
