name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            os: macos-15
          - language: c-cpp
            os: ubuntu-latest
          - language: csharp
            os: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: ${{ matrix.language }}
          build-mode: manual

      - name: Install XcodeGen
        if: matrix.language == 'swift'
        run: arch -arm64 /opt/homebrew/bin/brew install xcodegen

      - name: Build Swift application
        if: matrix.language == 'swift'
        run: |
          xcodegen generate
          xcodebuild \
            -project HerdMe.xcodeproj \
            -scheme HerdMe \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/codeql-swift \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build portable C++ core
        if: matrix.language == 'c-cpp'
        run: |
          cmake -S Core -B build/codeql-core -DBUILD_TESTING=ON
          cmake --build build/codeql-core --config Release

      - name: Install .NET 8
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Build Windows application and contracts
        if: matrix.language == 'csharp'
        shell: pwsh
        run: ./Windows/build.ps1 -Architecture x64 -Configuration Release

      - name: Upload C# build failure diagnostics
        if: failure() && matrix.language == 'csharp'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: HerdMe-${{ github.run_number }}-codeql-csharp-build-diagnostics
          path: |
            build/windows-native-build.log
            build/windows-native-build.binlog
            Windows/HerdMe.Windows/obj/**/input.json
            Windows/HerdMe.Windows/obj/**/output.json
          if-no-files-found: warn
          retention-days: 14

      - name: Analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: /language:${{ matrix.language }}
