name: HerdMe
options:
  bundleIdPrefix: app.herdme
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.1
targets:
  HerdMe:
    type: application
    platform: macOS
    info:
      path: HerdMe/Info.plist
      properties:
        CFBundleDisplayName: HerdMe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSPrincipalClass: NSApplication
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
    sources:
      - path: HerdMe
      - path: LICENSE
        buildPhase: resources
      - path: docs/THIRD_PARTY.md
        buildPhase: resources
    dependencies:
      - sdk: Network.framework
      - sdk: Security.framework
      - sdk: ServiceManagement.framework
      - sdk: WebKit.framework
    postCompileScripts:
      - name: Build Native Helpers
        script: |
          set -euo pipefail
          helper_directory="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$helper_directory"
          signing_identity="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          sign_native_helper() {
            if [ "$CONFIGURATION" = "Release" ] && [ "${HERDME_RELEASE_MODE:-local}" = "public" ]; then
              codesign --force --sign "$signing_identity" --identifier "$2" \
                --options runtime --timestamp "$1"
            elif [ "$CONFIGURATION" = "Release" ]; then
              codesign --force --sign "$signing_identity" --identifier "$2" \
                --options runtime --timestamp=none "$1"
            else
              codesign --force --sign "$signing_identity" --identifier "$2" \
                --timestamp=none "$1"
            fi
          }

          network_helper="$helper_directory/herdme-network-helper"
          xcrun --sdk macosx clang \
            -std=c17 -Os -Wall -Wextra -Werror \
            -arch arm64 -arch x86_64 \
            -mmacosx-version-min="$MACOSX_DEPLOYMENT_TARGET" \
            "$SRCROOT/Tools/NetworkHelper/main.c" \
            -o "$network_helper"
          chmod 0755 "$network_helper"
          sign_native_helper "$network_helper" app.herdme.network-helper

          portable_core="$helper_directory/herdme-core"
          xcrun --sdk macosx clang++ \
            -std=c++20 -Os -Wall -Wextra -Wpedantic -Werror \
            -arch arm64 -arch x86_64 \
            -mmacosx-version-min="$MACOSX_DEPLOYMENT_TARGET" \
            "-DHERDME_VERSION=\"$MARKETING_VERSION\"" \
            -I "$SRCROOT/Core/include" \
            "$SRCROOT/Core/src/core.cpp" \
            "$SRCROOT/Core/src/main.cpp" \
            -o "$portable_core"
          chmod 0755 "$portable_core"
          sign_native_helper "$portable_core" app.herdme.core

          daemon_source="$SRCROOT/HerdMe/Resources/app.herdme.network-service.plist"
          daemon_directory="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchDaemons"
          mkdir -p "$daemon_directory"
          /usr/bin/install -m 0644 "$daemon_source" \
            "$daemon_directory/app.herdme.network-service.plist"
        inputFiles:
          - $(SRCROOT)/Tools/NetworkHelper/main.c
          - $(SRCROOT)/Core/include/herdme/core.hpp
          - $(SRCROOT)/Core/src/core.cpp
          - $(SRCROOT)/Core/src/main.cpp
          - $(SRCROOT)/HerdMe/Resources/app.herdme.network-service.plist
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/herdme-network-helper
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/herdme-core
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchDaemons/app.herdme.network-service.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.herdme.desktop
        PRODUCT_NAME: HerdMe
        CODE_SIGN_STYLE: Automatic
        # HerdMe intentionally has no AppIntents or app-shortcut integration.
        LM_SKIP_METADATA_EXTRACTION: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          ENABLE_DEBUG_DYLIB: NO
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          ENABLE_HARDENED_RUNTIME: YES
  HerdMeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HerdMeTests
      - path: Core/tests/fixtures/php-modules
        buildPhase: resources
    dependencies:
      - target: HerdMe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        LM_SKIP_METADATA_EXTRACTION: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  HerdMeUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: HerdMeUITests
    dependencies:
      - target: HerdMe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        LM_SKIP_METADATA_EXTRACTION: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
schemes:
  HerdMe:
    build:
      targets:
        HerdMe: all
    run:
      config: Debug
      environmentVariables:
        HERDME_CREATE_LARAVEL_INTEGRATION: "$(HERDME_CREATE_LARAVEL_INTEGRATION)"
        HERDME_DATABASE_AUTH_INTEGRATION: "$(HERDME_DATABASE_AUTH_INTEGRATION)"
        HERDME_LARAVEL_PROJECT: "$(HERDME_LARAVEL_PROJECT)"
    test:
      config: Debug
      targets:
        - name: HerdMeTests
          parallelizable: false
      environmentVariables:
        HERDME_CREATE_LARAVEL_INTEGRATION: "$(HERDME_CREATE_LARAVEL_INTEGRATION)"
        HERDME_DATABASE_AUTH_INTEGRATION: "$(HERDME_DATABASE_AUTH_INTEGRATION)"
        HERDME_LARAVEL_PROJECT: "$(HERDME_LARAVEL_PROJECT)"
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  HerdMeUITests:
    build:
      targets:
        HerdMe: all
    test:
      config: Debug
      targets:
        - name: HerdMeUITests
          parallelizable: false
